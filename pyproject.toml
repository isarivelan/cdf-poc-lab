[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdf-intelligent-maintenance-investigator"
version = "0.1.0"
description = "Evidence-based Cognite Data Fusion maintenance investigation POC for a cooling-water pump."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CDF Intelligent Maintenance Investigator" }]
dependencies = [
  "cognite-sdk>=8.23,<9",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.22",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "streamlit>=1.33",
]

[project.optional-dependencies]
dev = [
  "cognite-toolkit>=0.9.60,<0.10",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: unit tests",
  "integration: local integration tests",
  "cdf: tests that require CDF credentials",
  "slow: longer tests",
]
addopts = "--cov=maintenance_investigator --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/maintenance_investigator"]
omit = [
  "*/clients/cdf_client.py",
  "*/functions_api.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "app", "scripts", "tests", "functions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"scripts/**" = ["E402"]
"functions/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
packages = ["maintenance_investigator"]
mypy_path = "src"
namespace_packages = false
